# /etc/sysctl.d/99-lowram-tuning.conf
# Optimasi Memori Kernel antiX Remote Station (Target: RAM 1 GB)

# Agresivitas swap tinggi untuk memanfaatkan zRAM terkompresi
vm.swappiness=150

# Menjaga cache direktori dan inode lebih lama di RAM untuk mengurangi I/O disk lambat
vm.vfs_cache_pressure=50

# Strict overcommit memory (Mode 2) untuk mencegah alokasi memori berlebih melebihi RAM + Swap
vm.overcommit_memory=2

# Rasio overcommit untuk Mode 2 (Default komputasi: Swap + (RAM * ratio / 100))
vm.overcommit_ratio=80

# Mengurangi ambang batas dirty memory agar flush ke storage lebih sering dalam chunk kecil
vm.dirty_background_ratio=5
vm.dirty_ratio=10
